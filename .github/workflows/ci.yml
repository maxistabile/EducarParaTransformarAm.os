# Integración Continua – Educar para Transformar (Unidad 4)
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verificar:
    name: Tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reporte-pruebas.xml

      - name: Guardar reporte de pruebas (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: frontend/reporte-pruebas.xml

      - name: Build
        run: npm run build

      - name: Guardar build (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: build-frontend
          path: frontend/dist
          retention-days: 7
